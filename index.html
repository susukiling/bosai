<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>防災速報ビュアー</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#10161d;--pn:#18212b;--ln:#2b3846;--tx:#e8eef4;--sub:#8fa1b3;--warn:#ff3b30}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
h1{font-size:16px;margin:0;flex:1}
button{background:#2a3b4d;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #5ac8fa}
#st{font-size:12px;padding:2px 8px;border-radius:10px;background:#444}
#st.on{background:#1f7a3d}#st.off{background:#8a5a00}
main{flex:1;display:flex;min-height:0}
#side{width:340px;max-width:42%;overflow:auto;background:var(--pn);border-right:1px solid var(--ln)}
#map{flex:1}
.it{padding:9px 12px;border-bottom:1px solid var(--ln);display:flex;gap:10px;cursor:pointer}
.it:hover{background:#202c38}
.sc{min-width:46px;height:46px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;text-align:center;line-height:1.1}
.it b{display:block}.it small{color:var(--sub)}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;margin-right:4px;background:#394b5e}
.tag.eew{background:var(--warn)}.tag.tsu{background:#0a84ff}
#banner{display:none;background:#8a5a00;padding:6px 12px;font-size:12px}
#legend{position:absolute;z-index:1000;right:10px;bottom:24px;background:rgba(16,22,29,.94);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:12px;max-width:230px}
#legend summary{cursor:pointer;font-weight:700}
#legend .r{display:flex;align-items:center;gap:6px;margin:2px 0}
#legend i{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid #fff6}
#legend p{margin:4px 0 0;color:var(--sub)}
.leaflet-popup-content{color:#111}
@keyframes pu{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0}}
.pulse{border-radius:50%;animation:pu 1.6s ease-out 3}
@media(max-width:700px){main{flex-direction:column-reverse}#side{width:100%;max-width:none;height:38%;border-right:0}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style></head><body>
<header><h1>防災速報ビュアー <small style="color:var(--sub);font-weight:400">地震・津波</small></h1>
<span id="st">接続中…</span><button id="nt">通知をオンにする</button></header>
<div id="banner">オフラインです。最後に保存した情報を表示しています。</div>
<main><div id="side"></div><div id="map"></div>
<details id="legend" open><summary>見方（凡例）</summary>
<div style="margin:4px 0 2px">色＝揺れの強さ（震度）</div>
<div id="lg"></div>
<div class="r" style="margin-top:6px"><i style="background:#888;width:10px;height:10px"></i><i style="background:#888;width:22px;height:22px"></i> 円が大きい＝規模(M)が大きい</div>
<div class="r"><i style="background:none;border:3px dashed #ff3b30"></i> 点滅＝新しく届いた情報</div>
<div class="r"><span class="tag eew">緊急</span> 緊急地震速報　<span class="tag tsu">津波</span> 津波予報</div>
<div class="r"><span class="tag" style="background:#c2410c">火山</span> 噴火速報・噴火警報（一覧のみ）</div>
<p>円をタップすると詳細。左の一覧をタップするとその場所へ移動します。</p></details></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SC={0:['?','#6b7785'],10:['1','#5ac8fa'],20:['2','#34c759'],30:['3','#d4c400'],40:['4','#ff9500'],45:['5弱','#ff6b2c'],50:['5強','#ff3b30'],55:['6弱','#d6246e'],60:['6強','#a3197a'],70:['7','#6a1b9a']};
const scOf=v=>SC[v]||SC[0];
const KEY='bosai_cache_v1',MAX=300; // 端末の保存上限(約300件)。超えた分は古い順に消えます
const API='https://api.p2pquake.net/v2';
let items=[],layer,map,markers={};
map=L.map('map',{zoomControl:true}).setView([37.5,137],5);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:12,attribution:'© OpenStreetMap contributors / 情報: P2P地震情報(気象庁)'}).addTo(map);
layer=L.layerGroup().addTo(map);
document.getElementById('lg').innerHTML=Object.keys(SC).filter(k=>k>0).map(k=>`<div class="r"><i style="background:${SC[k][1]}"></i>震度${SC[k][0]}${k==10?'（ごく弱い）':k==40?'（物が落ちる）':k==70?'（最大）':''}</div>`).join('');
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(items.slice(0,MAX)))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
// 正規化
function norm(d){
  if(d.code===551&&d.earthquake){const e=d.earthquake,h=e.hypocenter||{};
    return{id:d.id,type:'eq',time:e.time||d.time,name:h.name||'震源調査中',lat:h.latitude,lon:h.longitude,mag:h.magnitude,depth:h.depth,scale:e.maxScale||0,tsu:e.domesticTsunami,pts:(d.points||[]).slice(0,6).map(p=>p.addr+' 震度'+scOf(p.scale)[0]).join(' / ')}}
  if(d.code===556&&!d.cancelled){const e=d.earthquake||{},h=e.hypocenter||{};
    const mx=Math.max(0,...(d.areas||[]).map(a=>a.scaleTo||0));
    return{id:d.id,type:'eew',time:d.time,name:h.name||'震源不明',lat:h.latitude,lon:h.longitude,mag:h.magnitude,depth:h.depth,scale:mx,pts:(d.areas||[]).slice(0,8).map(a=>a.name).join('・'),test:d.test}}
  if(d.code===552&&!d.cancelled){
    return{id:d.id,type:'tsu',time:d.time,name:'津波予報',scale:0,pts:(d.areas||[]).slice(0,12).map(a=>({MajorWarning:'大津波警報',Warning:'津波警報',Watch:'津波注意報'}[a.grade]||'津波予報')+' '+a.name).join(' / ')}}
  return null}
function render(){
  layer.clearLayers();markers={};
  $('side').innerHTML=items.map(x=>{
    const [t,c]=x.type==='tsu'?['津','#0a84ff']:x.type==='vol'?['火','#c2410c']:scOf(x.scale);
    return`<div class="it" data-id="${x.id}"><div class="sc" style="background:${c}">${x.type==='tsu'?'津波':t}</div><div><b>${x.type==='eew'?'<span class="tag eew">緊急</span>':''}${x.type==='tsu'?'<span class="tag tsu">津波</span>':''}${x.type==='vol'?'<span class="tag" style="background:#c2410c">火山</span>':''}${x.name}</b><small>${(x.time||'').slice(0,16)}${x.mag>0?' ・M'+x.mag:''}${x.depth>=0&&x.depth!=null?' ・深さ'+(x.depth==0?'ごく浅い':x.depth+'km'):''}</small><br><small>${x.pts||''}</small></div></div>`}).join('')||'<p style="padding:12px;color:var(--sub)">まだ情報がありません</p>';
  items.forEach(x=>{
    if(x.type==='tsu'||x.lat==null||x.lat<-90)return;
    const c=scOf(x.scale)[1],r=Math.max(6,(x.mag>0?x.mag:3)*3.2);
    const m=L.circleMarker([x.lat,x.lon],{radius:r,color:'#fff',weight:x.type==='eew'?3:1.5,fillColor:c,fillOpacity:.85,dashArray:x.type==='eew'?'4 3':null}).addTo(layer);
    m.bindPopup(`<b>${x.name}</b><br>${x.time}<br>最大震度: ${scOf(x.scale)[0]}　M${x.mag>0?x.mag:'不明'}<br>${x.pts||''}`);
    markers[x.id]=m});
}
$('side').onclick=e=>{const el=e.target.closest('.it');if(!el)return;const m=markers[el.dataset.id];if(m){map.flyTo(m.getLatLng(),7);m.openPopup()}};
function add(x,notify){
  if(!x||items.some(i=>i.id===x.id))return;
  items.unshift(x);items.sort((a,b)=>(b.time||'').localeCompare(a.time||''));
  items=items.slice(0,MAX);save();render();
  if(notify)alertUser(x)}
function alertUser(x){
  const title=(x.type==='eew'?'【緊急地震速報】':x.type==='tsu'?'【津波情報】':'【地震情報】')+x.name;
  const body=(x.scale?'最大震度'+scOf(x.scale)[0]+' ':'')+(x.mag>0?'M'+x.mag+' ':'')+(x.pts||'');
  if(x.lat!=null){const m=markers[x.id];if(m){map.flyTo(m.getLatLng(),6);L.marker(m.getLatLng(),{icon:L.divIcon({className:'',html:'<div class="pulse" style="width:40px;height:40px;border:3px solid #ff3b30;margin:-20px 0 0 -20px"></div>'})}).addTo(layer)}}
  if('Notification'in window&&Notification.permission==='granted'){
    navigator.serviceWorker?.getRegistration().then(r=>r?r.showNotification(title,{body,requireInteraction:x.type==='eew',tag:x.id}):new Notification(title,{body}))}
  if(x.type==='eew'||x.scale>=40)try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.6)}catch(e){}}
$('nt').onclick=async()=>{if(!('Notification'in window))return alert('このブラウザは通知に対応していません');const p=await Notification.requestPermission();$('nt').textContent=p==='granted'?'通知オン':'通知がブロックされています'};
function setSt(s){const e=$('st');e.className=s?'on':'off';e.textContent=s?'受信中':'切断';$('banner').style.display=s?'none':'block'}
async function history(){
  try{const r=await fetch(API+'/history?codes=551&codes=552&codes=556&limit=100');const j=await r.json();
    items=[];j.map(norm).filter(Boolean).forEach(x=>items.push(x));items.sort((a,b)=>(b.time||'').localeCompare(a.time||''));save();render();setSt(true)}
  catch(e){setSt(false)}}
function connect(){
  const ws=new WebSocket('wss://api.p2pquake.net/v2/ws');
  ws.onopen=()=>setSt(true);
  ws.onmessage=ev=>{try{add(norm(JSON.parse(ev.data)),true)}catch(e){}};
  ws.onclose=()=>{setSt(false);setTimeout(()=>{history();connect()},5000)};
  ws.onerror=()=>ws.close()}
items=load();render();
if(items[0])map.setView([items[0].lat||37.5,items[0].lon||137],5);
history();connect();
if('serviceWorker'in navigator)navigator.serviceWorker.register('firebase-messaging-sw.js').catch(()=>{});
if('Notification'in window&&Notification.permission==='granted')$('nt').textContent='通知オン';
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {initializeFirestore,persistentLocalCache,collection,query,orderBy,limit,onSnapshot,doc,setDoc} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import {getMessaging,getToken} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js';
// ▼ Firebaseコンソールで取った設定値をここに貼る
const CFG={apiKey:'',authDomain:'',projectId:'',messagingSenderId:'',appId:''};
const VAPID=''; // ウェブプッシュ証明書の公開鍵
if(CFG.projectId){
  const app=initializeApp(CFG);
  const fs=initializeFirestore(app,{localCache:persistentLocalCache()}); // 端末に保存→オフラインでも履歴が見える
  onSnapshot(query(collection(fs,'events'),orderBy('time','desc'),limit(300)),s=>{
    s.docChanges().forEach(c=>{if(c.type==='added')window.add(c.doc.data(),false)})});
  document.getElementById('nt').onclick=async()=>{
    try{
      if(await Notification.requestPermission()!=='granted')return alert('通知がブロックされています');
      const reg=await navigator.serviceWorker.register('firebase-messaging-sw.js');
      const token=await getToken(getMessaging(app),{vapidKey:VAPID,serviceWorkerRegistration:reg});
      await setDoc(doc(fs,'tokens',token),{t:Date.now()});
      document.getElementById('nt').textContent='通知オン';
    }catch(e){alert('通知の登録に失敗しました: '+e.message)}}}
</script>
</body></html>
