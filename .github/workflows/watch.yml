name: watch
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i firebase-admin
      - run: node scripts/watch.mjs
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
